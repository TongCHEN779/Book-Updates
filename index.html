<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Books Tracker</title>
<link rel="alternate" type="application/rss+xml" title="New Books RSS" href="feed.xml">
<style>
  :root {
    --bg: #fafaf8; --fg: #1c1c1a; --muted: #6b6b66; --line: #e4e2dc; --card: #fff;
    --accent: #2f5fd1; --chip: #eef1f8; --chip-on: #2f5fd1; --chip-on-fg: #fff;
    --new: #d1442f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --fg: #ecebe6; --muted: #9b9a93; --line: #2a2a28; --card: #1d1d1b;
      --accent: #7a9cf0; --chip: #26272c; --chip-on: #7a9cf0; --chip-on-fg: #121212;
      --new: #f07a68;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 20px 24px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 13px; }
  header a { color: var(--accent); text-decoration: none; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: calc(100vh - 60px); }
  aside { border-right: 1px solid var(--line); padding: 16px 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 0; background: var(--chip); color: var(--fg); padding: 4px 10px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-fg); }
  .chip small { opacity: .6; margin-left: 4px; }
  input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 14px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 24px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); }
  .toolbar select { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  #list { padding: 16px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; align-content: start; }
  .book { display: grid; grid-template-columns: 72px 1fr; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .book img, .book .nocover { width: 72px; height: 104px; object-fit: cover; border-radius: 4px; background: var(--chip); }
  .book .nocover { display: grid; place-items: center; color: var(--muted); font-size: 11px; }
  .book h3 { margin: 0 0 2px; font-size: 15px; line-height: 1.3; }
  .book h3 a { color: inherit; text-decoration: none; }
  .book h3 a:hover { color: var(--accent); }
  .book .sub { color: var(--muted); font-size: 13px; }
  .book .line { font-size: 13px; margin-top: 4px; }
  .book .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .book .tag { font-size: 11px; background: var(--chip); padding: 1px 7px; border-radius: 999px; color: var(--muted); }
  .book .new { color: var(--new); font-weight: 600; font-size: 12px; }
  .book details { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .book summary { cursor: pointer; }
  .empty { padding: 48px 24px; color: var(--muted); text-align: center; grid-column: 1 / -1; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>New Books Tracker</h1>
  <span class="meta" id="updated">加载中…</span>
  <a href="feed.xml">RSS</a>
  <a href="https://github.com/" id="repo">GitHub</a>
</header>
<main>
  <aside>
    <h2>搜索</h2>
    <input type="search" id="q" placeholder="书名 / 作者 / 出版社">
    <h2>时间</h2>
    <div class="chips" id="when"></div>
    <h2>类别</h2>
    <div class="chips" id="categories"></div>
    <h2>出版社</h2>
    <div class="chips" id="publishers"></div>
    <h2>作者</h2>
    <div class="chips" id="authors"></div>
    <h2>按类别订阅 RSS</h2>
    <div class="chips" id="feeds"></div>
  </aside>
  <section>
    <div class="toolbar">
      <span id="count"></span>
      <span style="flex:1"></span>
      <label>排序
        <select id="sort">
          <option value="first_seen">首次发现</option>
          <option value="published">出版日期</option>
          <option value="title">书名</option>
        </select>
      </label>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const state = { q: '', when: 7, categories: new Set(), publishers: new Set(), authors: new Set(), sort: 'first_seen' };
  let books = [];

  try {
    const res = await fetch('data/books.json?' + Date.now());
    const data = await res.json();
    books = data.books || [];
    $('#updated').textContent = `更新于 ${new Date(data.updated).toLocaleString()} · 共 ${data.count} 本`;
  } catch (e) {
    $('#updated').textContent = '还没有数据 —— 先跑一次 scripts/fetch_books.py 或等 Actions 定时任务';
  }

  // ---- 筛选器：从数据里动态生成（基于 matched，即 watch.yaml 里命中的规则） ----
  const tally = (key) => {
    const m = new Map();
    for (const b of books) for (const v of (b.matched?.[key] || [])) m.set(v, (m.get(v) || 0) + 1);
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  };
  const renderChips = (key) => {
    const el = $('#' + key);
    el.innerHTML = '';
    for (const [v, n] of tally(key)) {
      const c = document.createElement('button');
      c.className = 'chip' + (state[key].has(v) ? ' on' : '');
      c.innerHTML = `${esc(v)}<small>${n}</small>`;
      c.onclick = () => { state[key].has(v) ? state[key].delete(v) : state[key].add(v); renderChips(key); render(); };
      el.appendChild(c);
    }
    if (!el.children.length) el.innerHTML = '<span class="chip" style="opacity:.5">无</span>';
  };
  const whenOpts = [[1, '今天'], [7, '7 天'], [30, '30 天'], [0, '全部']];
  const renderWhen = () => {
    const el = $('#when'); el.innerHTML = '';
    for (const [d, label] of whenOpts) {
      const c = document.createElement('button');
      c.className = 'chip' + (state.when === d ? ' on' : '');
      c.textContent = label;
      c.onclick = () => { state.when = d; renderWhen(); render(); };
      el.appendChild(c);
    }
  };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https?:\/\//.test(u || '') ? esc(u) : '#');

  // ---- 按类别的 RSS 订阅链接（feed/index.json 由脚本生成） ----
  try {
    const feeds = await (await fetch('feed/index.json?' + Date.now())).json();
    const box = $('#feeds');
    for (const f of feeds) {
      const a = document.createElement('a');
      a.className = 'chip';
      a.href = f.file;
      a.style.textDecoration = 'none';
      a.innerHTML = `${esc(f.name)}<small>${f.count}</small>`;
      box.appendChild(a);
    }
  } catch (e) { /* 还没生成就不显示 */ }

  // 封面：豆瓣图片有防盗链，从本站加载一律 403，所以不请求它，直接显示占位图；其他来源加载失败时也回退到占位图
  const coverUrl = (b) => (b.cover && !/doubanio\.com/.test(b.cover) ? b.cover : '');

  const daysAgo = (iso) => (Date.now() - new Date(iso)) / 86400000;
  const today = new Date().toISOString().slice(0, 10);

  function render() {
    const q = state.q.trim().toLowerCase();
    let rows = books.filter((b) => {
      if (state.when && daysAgo(b.first_seen) > state.when) return false;
      for (const k of ['categories', 'publishers', 'authors']) {
        if (state[k].size && ![...state[k]].some((v) => (b.matched?.[k] || []).includes(v))) return false;
      }
      if (q) {
        const hay = [b.title, b.subtitle, ...(b.authors || []), b.publisher, ...(b.categories || [])].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    rows.sort((a, b) => state.sort === 'title'
      ? a.title.localeCompare(b.title)
      : (b[state.sort] || '').localeCompare(a[state.sort] || ''));

    $('#count').textContent = `${rows.length} 本`;
    const list = $('#list');
    list.innerHTML = rows.length ? '' : '<div class="empty">没有符合条件的书</div>';
    for (const b of rows) {
      const el = document.createElement('article');
      el.className = 'book';
      const cu = coverUrl(b);
      const cover = cu
        ? `<img src="${safeUrl(cu)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'nocover',textContent:'无封面'}))">`
        : '<div class="nocover">无封面</div>';
      const tags = [...(b.matched?.categories || []).map((t) => `<span class="tag">#${esc(t)}</span>`),
                    ...(b.sources || []).map((s) => `<span class="tag">${esc(s)}</span>`)].join('');
      el.innerHTML = `
        ${cover}
        <div>
          <h3><a href="${safeUrl(b.url)}" target="_blank" rel="noopener">${esc(b.title)}</a></h3>
          ${b.subtitle ? `<div class="sub">${esc(b.subtitle)}</div>` : ''}
          <div class="line">${esc((b.authors || []).join(', ')) || '—'}</div>
          <div class="line sub">${esc(b.publisher) || '—'} · ${esc(b.published)}
            ${b.first_seen === today ? '<span class="new">· 今日新增</span>' : ''}</div>
          <div class="tags">${tags}</div>
          ${b.description ? `<details><summary>简介</summary>${esc(b.description)}</details>` : ''}
        </div>`;
      list.appendChild(el);
    }
  }

  $('#q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  $('#sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
  renderWhen();
  ['categories', 'publishers', 'authors'].forEach(renderChips);
  render();
})();
</script>
</body>
</html>
