name: Update new books

on:
  schedule:
    # 18:17 UTC = 北京时间 02:17（凌晨）。避开整点，减少 GitHub 定时任务排队延迟
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-books
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch books
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python scripts/fetch_books.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json feed.xml feed/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update books $(date -u +%F)"
            git push
          fi
