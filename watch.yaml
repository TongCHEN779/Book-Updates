# 追踪范围配置 —— 改这个文件就等于改追踪范围，不用动代码。
# 三个维度各自独立查询，结果合并去重后进入同一份 data/books.json。

categories:
  - machine learning
  - deep learning
  - optimization
  - architecture
  - literature
  - art
  - philosophy
  # 中文类别：Google Books 里中文书的 subject 多为中文
  - 文学
  - 艺术
  - 哲学

publishers:
  - Springer
  - MIT Press
  - O'Reilly Media
  - Cambridge University Press
  # 中文出版社
  - 中信出版社
  - 机械工业出版社
  - 人民邮电出版社
  - 电子工业出版社
  - 清华大学出版社
  - 人民文学出版社
  - 上海译文出版社
  - 商务印书馆
  - 中华书局
  - 生活·读书·新知三联书店
  - 北京大学出版社

authors:
  - Kevin P. Murphy
  - Christopher Bishop

# 语言过滤（Google Books 的 langRestrict），留空表示不限
languages:
  - en
  - zh

# 数据源开关
sources:
  google_books: true
  open_library: true

# 只保留出版日期在最近 N 天内（含未来预售）的书；API 返回的日期经常不准，这个值别设太小
published_within_days: 120

# 出版日期最多可以晚于今天多少天（预售书）；超过的基本是 API 脏数据（如 2035 年），直接丢弃
max_future_days: 180

# 一本书被系统首次发现后保留多少天，超过就从 books.json 里清掉，避免文件无限增长
retain_days: 365

# 每个查询最多取多少条
max_results_per_query: 40
